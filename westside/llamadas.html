<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>WestSide — Llamadas</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg: #0A0A0A; --card: #151515; --line: #262626; --text: #F5F5F5; --muted: #9A9A9A;
            --brand: #CF3339; --ok: #22A55A; --warn: #E5A100;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
        body { min-height: 100dvh; display: flex; justify-content: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
        main { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px; }
        header { display: flex; align-items: center; justify-content: space-between; }
        .brand { font-weight: 800; letter-spacing: .04em; font-size: 15px; }
        .brand b { color: var(--brand); }
        .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
        h1 { font-size: 20px; margin: 0 0 4px; }
        p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
        label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
        input[type=text], input[type=password], input[type=tel] {
            width: 100%; background: #0E0E0E; color: var(--text); border: 1px solid var(--line); border-radius: 12px;
            padding: 12px 14px; font-size: 16px; font-family: inherit; outline: none;
        }
        input:focus { border-color: var(--brand); }
        button { font-family: inherit; cursor: pointer; border: 0; }
        .primary { width: 100%; margin-top: 18px; background: var(--brand); color: #fff; font-weight: 700; font-size: 16px; padding: 14px; border-radius: 14px; }
        .primary:disabled { opacity: .5; }
        .error { color: #FF6B6B; font-size: 13px; margin-top: 10px; min-height: 18px; }
        .hidden { display: none !important; }

        .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
        .dot.ok { background: var(--ok); } .dot.off { background: #555; } .dot.live { background: var(--brand); animation: pulse 1.2s infinite; }
        @keyframes pulse { 50% { opacity: .35; } }
        .caller { font-size: 12px; color: var(--muted); margin-top: 6px; }
        .caller b { color: var(--text); font-weight: 600; }

        .display { width: 100%; text-align: center; font-size: 30px; font-weight: 600; letter-spacing: .02em; background: transparent; border: 0; padding: 18px 0 6px; color: var(--text); outline: none; }
        .sub { text-align: center; min-height: 20px; font-size: 14px; color: var(--muted); }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0 8px; }
        .key { aspect-ratio: 1.35; border-radius: 16px; background: #1D1D1D; color: var(--text); font-size: 24px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
        .key small { font-size: 9px; letter-spacing: .18em; color: var(--muted); margin-top: 4px; font-weight: 500; }
        .key:active { background: #2A2A2A; }
        .actions { display: grid; grid-template-columns: 1fr 72px 1fr; align-items: center; justify-items: center; margin-top: 10px; }
        .round { width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; }
        .call { background: var(--ok); } .hang { background: var(--brand); }
        .call:disabled { opacity: .4; }
        .ghost { background: transparent; color: var(--muted); font-size: 13px; padding: 10px; border-radius: 10px; }
        .ghost.on { color: var(--text); background: #222; }
        .foot { text-align: center; font-size: 11px; color: #666; }
        .foot button { background: none; color: var(--muted); text-decoration: underline; font-size: 11px; }
    </style>
</head>
<body>
<main>
    <header>
        <div class="brand">WEST<b>SIDE</b> · Llamadas</div>
        <span class="tag">Demo WebRTC</span>
    </header>

    <!-- Entrar -->
    <section id="login" class="card">
        <h1>Entrar</h1>
        <p>Llama a clientes desde este navegador con el número de la sucursal. El navegador te pedirá permiso para usar el micrófono.</p>
        <form id="loginForm" autocomplete="on">
            <label for="vendedor">Tu nombre</label>
            <input id="vendedor" type="text" name="vendedor" placeholder="Ej. Carla" maxlength="40" required autocomplete="name" />
            <label for="pin">PIN de la demo</label>
            <input id="pin" type="password" name="pin" inputmode="numeric" required autocomplete="current-password" />
            <button class="primary" id="loginBtn" type="submit">Entrar</button>
            <div class="error" id="loginError"></div>
        </form>
    </section>

    <!-- Marcador -->
    <section id="dialer" class="card hidden">
        <div class="status"><span class="dot" id="dot"></span><span id="statusText">Conectando…</span></div>
        <div class="caller">Llamas como <b id="callerId">—</b> · <span id="who"></span></div>

        <input id="number" class="display" type="tel" inputmode="tel" placeholder="Número" autocomplete="off" />
        <div class="sub" id="callInfo"></div>

        <div class="keypad" id="keypad"></div>

        <div class="actions">
            <button class="ghost" id="muteBtn" type="button" disabled>Silenciar</button>
            <button class="round call" id="callBtn" type="button" aria-label="Llamar" disabled>
                <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
            </button>
            <button class="ghost" id="clearBtn" type="button" aria-label="Borrar">Borrar</button>
        </div>
    </section>

    <div class="foot">
        <span id="footNote">Telnyx WebRTC · MC Designs</span>
        <button id="logoutBtn" type="button" class="hidden">Salir</button>
    </div>
    <audio id="remoteMedia" autoplay playsinline></audio>
</main>
<script type="module" src="./llamadas.js"></script>
</body>
</html>
